name: "Rust Check (verify branch)"

# Samostatný workflow na overenie Rustu z NEFIXNUTYCH vetiev.
#
# `build-release.yml` sa spúšťa len na push do `main` a na tagy, takže sa nedal
# použiť na overenie pred merge - a push do `main` by zároveň vytvoril release.
#
# `cargo clippy -- -D warnings` je ten istý gate, aký používa release workflow,
# takže chyba, ktorá by zablokovala release, je viditeľná tu a skôr.

on:
  push:
    branches:
      - 'verify/**'
  pull_request:
  workflow_dispatch:

jobs:
  rust-check:
    name: "fmt + clippy + test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies for Tauri checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust codebase (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Backend Unit & Integration Tests (cargo test)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build