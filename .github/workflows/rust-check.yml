name: "Rust Check (verify branch)"

# Samostatný workflow na overenie Rustu z NEFIXNUTYCH vetiev.
#
# `build-release.yml` sa spúšťa len na push do `main` a na tagy, takže sa nedal
# použiť na overenie pred merge - a push do `main` by zároveň vytvoril release.
#
# KROK 1 je `cargo check --tests`: kontroluje typy a syntaktické chyby bez toho,
# aby zostavoval alebo linkoval čokoľvek. Keďže na tomto stroji blokuje Windows
# Application Control spúšťanie novovytvorených `.exe`, build skripty sa nedajú
# spustiť, takže `cargo clippy` a `cargo test` tu neprejdú. `cargo check` je
# presne ten krok, ktorý zachytí prípadné chyby v zmenených súboroch.

on:
  push:
    branches:
      - 'verify/**'
  pull_request:
  workflow_dispatch:

jobs:
  rust-check:
    name: "typecheck (cargo check)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies for Tauri checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Vypise vsetky warningy, ale nesfali - chceme vidiet cisty zoznam.
      - name: Lint Rust codebase (cargo clippy, report only)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets --all-features 2>&1 | tee clippy.log

      - name: Publish clippy findings to the job summary
        working-directory: src-tauri
        if: always()
        run: |
          {
            echo "## clippy output"
            echo ""
            echo '```'
            cat clippy.log || echo "(ziadny log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck Rust sources (cargo check --tests)
        working-directory: src-tauri
        run: cargo check --tests --message-format short

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build