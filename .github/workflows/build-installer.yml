name: "Build Windows Installer"

# Zostaví Windows inštalátor (portable .exe + MSI + NSIS) a ponúkne ho ako
# artefakt workflow. Nespúšťa sa pri pushi do `main` - beží len na:
#   * push do vetvy `build/**`
#   * workflow_dispatch (ak je kľúč dostupný)
#
# `build-release.yml` riešil to isté, ale vytváral GitHub Release pri každom
# behu. Pri pokusoch je to nežiaduce, preto sa tu používa priamo
# `tauri build` a výsledok ide do artefaktu - žiadny release nevzniká.

on:
  push:
    branches:
      - 'build/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: "Windows MSI + NSIS + portable exe"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable (MSVC target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Show versions
        shell: bash
        run: |
          node -v
          npm -v
          rustc -V
          cargo -V

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri application (portable exe + MSI + NSIS)
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --bundles nsis,msi 2>&1 | tee build.log
          echo "TAURI_EXIT=$?"

      - name: Upload installers as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-dubbing-windows-installer
          if-no-files-found: warn
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      # Overenie, ktoré stojí za to. Oprava #1 z WORKFLOW_BUGFIX_NOTES:
      # `scripts/*.py` musia byť zabalené ako Tauri resources, inak
      # `ensure_scripts_synced` nájde prázdny workspace a pipeline zomrie na
      # "can't open file '.../stage_1_demux.py'". Radšej to vidieť tu než pri
      # prvom behu nainštalovanej aplikácie.
      - name: Verify bundled Python scripts
        if: always()
        shell: bash
        run: |
          echo "=== searching for bundled scripts ==="
          missing=0
          for d in src-tauri/target/release target/release; do
            if [ -d "$d/scripts" ]; then
              echo "FOUND: $d/scripts"
              ls -la "$d/scripts"
              for i in 1 2 3 4 5 6; do
                if ! ls "$d/scripts"/stage_${i}_*.py >/dev/null 2>&1; then
                  echo "::error::stage_${i} chýba v $d/scripts"
                  missing=1
                fi
              done
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "OK: všetkých 6 stage skriptov je zabalených"
          else
            echo "::error::niektoré python fázy nie sú zabalené - pipeline nebude fungovať"
            exit 1
          fi

      - name: Publish build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Build output"
            echo ""
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "(ziadny build.log)"
            echo '```'
            echo ""
            echo "### Artefakty"
            echo '```'
            ls -la src-tauri/target/release/*.exe 2>/dev/null || echo "(ziadny portable exe)"
            ls -la src-tauri/target/release/bundle/msi/*.msi 2>/dev/null || echo "(ziadny msi)"
            ls -la src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null || echo "(ziadny nsis)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"