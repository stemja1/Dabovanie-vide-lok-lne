name: "Release Windows Build"

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    name: "Rust & Frontend Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system dependencies for Tauri checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust formatting (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Lint Rust codebase (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Backend Unit & Integration Tests (cargo test)
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Install npm dependencies
        run: npm install

      - name: Typecheck and Build Frontend
        run: npm run build

  build-tauri:
    name: "Build Windows App"
    needs: quality-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Synchronize Version from Git Tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" || "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="1.1.9"
          fi
          echo "=== Setting Project Version to: $VERSION ==="
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = '$VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          "
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          echo "Updated Cargo.toml version:"
          grep -n "^version =" src-tauri/Cargo.toml

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Application (Windows EXE & MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Dabing Štúdio ${{ github.ref_name }} (Pre-built Windows App)"
          releaseBody: |
            ## 🚀 Predkompilovaná verzia AI Dabing Štúdio ${{ github.ref_name }} pre Windows 11
            
            Stiahnite si inštalátor `.exe` alebo `.msi` priamo z priložených súborov (Assets) nižšie:
            - V názvoch všetkých inštalátorov je priamo uvedená presná verzia zostavenia (`${{ github.ref_name }}`).
            
            ### Požiadavky:
            - Windows 11 s WSL2 (Ubuntu 24.04)
            - AMD Radeon RX 7700 XT (alebo ľubovoľná AMD/NVIDIA grafická karta / CPU)
            - Vstavaný sprievodca jedným kliknutím nainštaluje všetky AI modely do WSL2.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
