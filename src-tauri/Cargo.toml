[package]
name = "ai-dubbing-orchestrator"
version = "0.1.0"
description = "Orchestrator pre lokálny AI dabing zo slovenčiny do čínštiny"
authors = ["stemja1 <steamja1@gmail.com>"]
edition = "2021"

[lib]
name = "ai_dubbing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
sysinfo = "0.31"
sha2 = "0.10"
open = "5.3"
dirs = "5.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[lints.rust]
unsafe_code = "forbid"
bare_trait_objects = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant_else = "warn"
needless_raw_string_hashes = "warn"
semicolon_if_nothing_returned = "warn"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
